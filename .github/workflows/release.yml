name: release

on:
  push:
    tags: ['v*']
  # Fallback automático: release-please crea el tag con GITHUB_TOKEN y GitHub
  # NO dispara workflows con tags creados por un token. release-please.yml
  # despacha este workflow por API con --ref <tag> (workflow_dispatch SÍ se
  # dispara con GITHUB_TOKEN). Con ref de tag, github.ref_name = vX.Y.Z y
  # github.sha = commit del tag → el resto del workflow no cambia.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    name: build + push ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, network, web, password, recon, forensics, blueteam, redteam, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Liberar espacio de disco (full descomprimida >20 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: secforge
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Sin token configurado, best-effort: el release no debe romperse por esto.
        continue-on-error: true

      - name: Build
        id: build
        run: |
          TAR=$(nix build .#kali-${{ matrix.variant }} --no-link --print-out-paths)
          echo "tar=$TAR" >> "$GITHUB_OUTPUT"
          echo "tar: $TAR"

      - name: Verificar integridad del tar (nix store verify + sha256 doble)
        id: verify
        run: |
          TAR='${{ steps.build.outputs.tar }}'
          nix store verify "$TAR"
          H1=$(sha256sum "$TAR" | awk '{print $1}')
          H2=$(sha256sum "$TAR" | awk '{print $1}')
          echo "sha256 #1: $H1"
          echo "sha256 #2: $H2"
          [ "$H1" = "$H2" ] || { echo "ROJO: lecturas distintas $H1 vs $H2"; exit 1; }
          echo "sha256=$H1" >> "$GITHUB_OUTPUT"

      # Gotcha #11: docker load puede imprimir un Error y salir 0. Detectar en la SALIDA.
      - name: docker load supervisado
        run: |
          OUT=$(docker load < '${{ steps.build.outputs.tar }}' 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT"
          if echo "$OUT" | grep -qi 'error'; then
            echo "ROJO: docker load reportó error pese a exit 0 (gotcha #11)"; exit 1
          fi

      # El smoke va ANTES de publicar: nunca subir a GHCR una imagen que no pasa.
      - name: Smoke L2 obligatorio (antes de publicar)
        run: RUNTIME=docker bash tests/smoke.sh "secforge-${{ matrix.variant }}:nix" "tests/smoke/${{ matrix.variant }}.tsv"

      - name: Push a GHCR con tags semánticos
        id: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="secforge-${{ matrix.variant }}"
          # GHCR exige namespace en minúsculas: github.repository_owner puede traer mayúsculas.
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REF="${{ github.ref_name }}"          # v0.1.0
          MINOR="$(echo "$REF" | cut -d. -f1,2)" # v0.1
          MAJOR="$(echo "$REF" | cut -d. -f1)"   # v0
          SHA_TAG="sha-${GITHUB_SHA:0:7}"        # commit
          for tag in "$REF" "$MINOR" "$MAJOR" "$SHA_TAG"; do
            docker tag "${IMAGE}:nix" "ghcr.io/${OWNER}/${IMAGE}:${tag}"
            docker push "ghcr.io/${OWNER}/${IMAGE}:${tag}"
          done
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/${OWNER}/${IMAGE}:${REF}")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "GHCR: $DIGEST"

      - name: Evidencia de release (sha256 + digest)
        run: |
          {
            echo "variant=${{ matrix.variant }}"
            echo "tag=${{ github.ref_name }}"
            echo "commit=${{ github.sha }}"
            echo "sha256_tar=${{ steps.verify.outputs.sha256 }}"
            echo "image_digest=${{ steps.push.outputs.digest }}"
          } | tee "release-${{ matrix.variant }}.txt"
          cat "release-${{ matrix.variant }}.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.variant }}
          path: release-${{ matrix.variant }}.txt

  release:
    name: GitHub Release con notas
    needs: build-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Idempotencia real: release-please puede haber creado ya una Release
      # (a veces en DRAFT) para este tag. `gh release create` sobre un tag que
      # ya tiene una release NO es idempotente: crea una SEGUNDA release
      # (medido) → duplicados con el mismo tag. Aquí se:
      #   1) publica el draft existente si lo hay,
      #   2) si no existe ninguna, la crea,
      #   3) borra cualquier OTRO draft con el mismo tag (basura de intentos).
      - name: GitHub Release con notas (idempotente)
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La Release $TAG ya existe: se publica si estaba en draft"
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]]; then
              gh release edit "$TAG" --draft=false
              echo "Draft publicado"
            fi
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
            echo "Release creada"
          fi
          # Limpieza de drafts duplicados con el mismo tag.
          for ID in $(gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.tag_name == "'"$TAG"'" and .draft == true) | .id'); do
            echo "Borrando draft duplicado $ID"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$ID"
          done
          gh release view "$TAG" --json url,isDraft,tagName,publishedAt \
            --jq '"Release: \(.tagName) draft=\(.isDraft) published=\(.publishedAt) \(.url)"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
