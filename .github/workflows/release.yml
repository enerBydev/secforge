name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    name: build + push ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, network, web, password, recon, forensics, blueteam, redteam, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Liberar espacio de disco (full descomprimida >20 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: secforge
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Sin token configurado, best-effort: el release no debe romperse por esto.
        continue-on-error: true
      - run: nix build .#kali-${{ matrix.variant }}
      - run: docker load < result
      - name: Push a GHCR con tags semánticos
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="secforge-${{ matrix.variant }}"
          MAJOR="$(echo "${{ github.ref_name }}" | cut -d. -f1)"
          for tag in "${{ github.ref_name }}" "${MAJOR}"; do
            docker tag "${IMAGE}:nix" "ghcr.io/${{ github.repository_owner }}/${IMAGE}:${tag}"
            docker push "ghcr.io/${{ github.repository_owner }}/${IMAGE}:${tag}"
          done
      - name: Smoke L2 sobre la imagen recién construida
        run: |
          docker load < result
          RUNTIME=docker bash tests/smoke.sh "secforge-${{ matrix.variant }}:nix" "tests/smoke/${{ matrix.variant }}.tsv"

  release:
    name: GitHub Release con notas
    needs: build-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GitHub Release con notas (idempotente — release-please puede haberla creado ya)
        run: gh release create "${{ github.ref_name }}" --generate-notes 2>/dev/null || gh release view "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
