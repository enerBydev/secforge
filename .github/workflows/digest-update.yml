name: digest-update

# "Versionado autónomo" del snapshot de Kali: PR semanal que actualiza el
# digest anclado y SOLO se mergea si el CI completo está en verde.

on:
  schedule:
    - cron: '0 5 * * 1' # lunes 05:00 UTC
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Tag de kalilinux/kali-rolling a anclar'
        required: false
        default: latest
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write # workflow_dispatch + consultar el run del CI

jobs:
  bump-kali-digest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Obtener digest y hash actuales de kali-rolling
        id: bump
        run: |
          TAG="${{ inputs.image-tag || 'latest' }}"
          echo "tag upstream: $TAG"
          nix run nixpkgs#nix-prefetch-docker -- \
            --image-name kalilinux/kali-rolling \
            --image-tag "$TAG" --arch amd64 --os linux | tee "$RUNNER_TEMP/prefetch.txt"
          PREFETCH="$RUNNER_TEMP/prefetch.txt"
          # Formato actual (nix-prefetch-docker reciente):
          #   -> ImageDigest: sha256:...
          #   -> ImageHash: sha256-...
          # Fallbacks: formatos antiguos y el attrset que imprime al final.
          DIGEST="$(grep -oPm1 'ImageDigest: \K.*' "$PREFETCH" || true)"
          HASH="$(grep -oPm1 'ImageHash: \K.*' "$PREFETCH" || true)"
          [[ -n "$DIGEST" ]] || DIGEST="$(grep -oPm1 'imageDigest = "\K[^"]+' "$PREFETCH" || true)"
          [[ -n "$HASH" ]] || HASH="$(grep -oPm1 '\bhash = "\K[^"]+' "$PREFETCH" || true)"
          [[ -n "$DIGEST" && -n "$HASH" ]] || {
            echo "ROJO: parseo de nix-prefetch-docker falló"; cat "$PREFETCH"; exit 2;
          }
          CURRENT="$(grep -oPm1 'imageDigest = "\K[^"]+' images/base.nix || true)"
          echo "digest actual  : $CURRENT"
          echo "digest upstream: $DIGEST"
          if [[ "$DIGEST" = "$CURRENT" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Kali sin cambios ($DIGEST): no se crea PR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            sed -i "s|imageDigest = \"sha256:.*\"|imageDigest = \"${DIGEST}\"|" images/base.nix
            sed -i "s|sha256 = \".*\"|sha256 = \"${HASH}\"|" images/base.nix
            echo "Kali actualizado a $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Gotcha conocido: el hash de nix-prefetch-docker puede no coincidir con el
      # que espera dockerTools.pullImage (tarball distinto según versión de skopeo).
      # Si el build falla por hash mismatch, usar el "got:" que Nix calculó y reintentar.
      # OJO: el log va FUERA del repo ($RUNNER_TEMP) — si cae en el workspace,
      # create-pull-request lo commitea dentro del PR (sucio).
      - name: Validar que la imagen base sigue construyendo
        if: steps.bump.outputs.changed == 'true'
        run: |
          LOG="$RUNNER_TEMP/build.err"
          if ! nix build .#kali-slim 2>"$LOG"; then
            GOT="$(grep -oP 'got:\s+\Ksha256-[A-Za-z0-9+/=]+' "$LOG" | head -1 || true)"
            if [[ -z "$GOT" ]]; then
              echo "ROJO: build falló y no se pudo extraer el hash esperado"; cat "$LOG"; exit 1
            fi
            echo "Hash de prefetch incorrecto; usando el calculado por Nix: $GOT"
            sed -i "s|sha256 = \".*\"|sha256 = \"${GOT}\"|" images/base.nix
            nix build .#kali-slim
          fi

      - name: Crear PR
        id: pr
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: 'chore(kali): bump snapshot digest'
          title: 'chore(kali): bump snapshot digest semanal'
          body: |
            Actualización automática del digest de `kalilinux/kali-rolling`.
            - El build de `kali-slim` ya fue validado en este PR (verde antes del merge).
            - Si el CI falla, el merge no procederá.
          branch: chore/kali-digest-bump
          delete-branch: true

      # GitHub crea el run pull_request del PR, pero lo RETIENE (action_required)
      # porque el PR lo creó GITHUB_TOKEN. No hace falta PAT: la API de approve
      # permite desbloquearlo con el mismo token de Actions (actions: write).
      - name: Aprobar el run pull_request retenido y esperar
        id: ci
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          BRANCH="chore/kali-digest-bump"
          PR="${{ steps.pr.outputs.pull-request-number }}"
          HEAD_SHA="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          echo "PR #$PR head=$HEAD_SHA"
          RUN_ID=""
          for _ in $(seq 1 45); do
            # Filtrar por SHA: la rama puede tener runs de intentos anteriores.
            RUN_ID="$(gh run list --workflow=ci.yml --branch "$BRANCH" \
              --event pull_request --limit 50 --json databaseId,headSha \
              | jq -r --arg sha "$HEAD_SHA" \
                '[.[] | select(.headSha == $sha) | .databaseId][0] // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 2
          done
          [[ -n "$RUN_ID" ]] || { echo "ROJO: no apareció el run pull_request del head $HEAD_SHA"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "CI run: $RUN_ID"
          # El run puede tardar unos segundos en pasar de queued a action_required.
          for _ in $(seq 1 20); do
            STATUS="$(gh run view "$RUN_ID" --json status --jq '.status')"
            CONCLUSION="$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion // ""')"
            echo "estado: $STATUS / ${CONCLUSION:-<sin conclusión>}"
            if [[ "$CONCLUSION" == "action_required" ]]; then
              echo "Run retenido por GitHub (PR de GITHUB_TOKEN): aprobando..."
              gh api -X POST "repos/${{ github.repository }}/actions/runs/$RUN_ID/approve"
              break
            fi
            [[ "$STATUS" == "in_progress" || "$STATUS" == "completed" ]] && break
            sleep 2
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mergear solo si el CI está verde
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          gh run watch "${{ steps.ci.outputs.run_id }}" --exit-status --interval 20
          PR="${{ steps.pr.outputs.pull-request-number }}"
          [[ -n "$PR" ]] || { echo "ROJO: PR no encontrado"; exit 1; }
          gh pr merge "$PR" --squash
          echo "PR #$PR mergeado tras CI verde" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
