name: digest-update

# "Versionado autónomo" del snapshot de Kali: PR semanal que actualiza el
# digest anclado y SOLO se mergea si el CI completo está en verde.

on:
  schedule:
    - cron: '0 5 * * 1' # lunes 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # workflow_dispatch + consultar el run del CI

jobs:
  bump-kali-digest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Obtener digest y hash actuales de kali-rolling
        run: |
          nix run nixpkgs#nix-prefetch-docker -- \
            --image-name kalilinux/kali-rolling \
            --image-tag latest --arch amd64 --os linux > prefetch.txt
          cat prefetch.txt
          DIGEST="$(grep -oP 'Image digest: \K.*' prefetch.txt)"
          HASH="$(grep -oP 'Image digest \(sha256\): \K.*' prefetch.txt)"
          test -n "$DIGEST" && test -n "$HASH" || { echo "Parseo falló"; exit 2; }
          sed -i "s|imageDigest = \"sha256:.*\"|imageDigest = \"${DIGEST}\"|" images/base.nix
          sed -i "s|sha256 = \".*\"|sha256 = \"${HASH}\"|" images/base.nix
          # Gotcha conocido: el hash de prefetch a veces es erróneo → validar con build real
      - name: Validar que la imagen base sigue construyendo
        run: nix build .#kali-slim
      - name: Crear PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: 'chore(kali): bump snapshot digest'
          title: 'chore(kali): bump snapshot digest semanal'
          body: |
            Actualización automática del digest de `kalilinux/kali-rolling`.
            - El build de `kali-slim` ya fue validado en este PR (verde antes del merge).
            - Si el CI falla, el auto-merge no procederá.
          branch: chore/kali-digest-bump
          delete-branch: true
      # Un PR creado con GITHUB_TOKEN no dispara pull_request (recursión), así que
      # los checks requeridos nunca correrían y el auto-merge esperaría eternamente.
      # workflow_dispatch SÍ está exento: lanzamos ci.yml sobre la misma rama/SHA.
      - name: Disparar CI sobre la rama del PR
        id: ci
        run: |
          BRANCH="chore/kali-digest-bump"
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow=ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 2
          done
          [[ -n "$RUN_ID" ]] || { echo "ROJO: el CI no apareció tras el dispatch"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "CI run: $RUN_ID"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mergear solo si el CI está verde
        run: |
          gh run watch "${{ steps.ci.outputs.run_id }}" --exit-status --interval 20
          PR="$(gh pr list --state open --head chore/kali-digest-bump \
            --json number --jq '.[0].number // empty')"
          [[ -n "$PR" ]] || { echo "ROJO: PR no encontrado"; exit 1; }
          gh pr merge "$PR" --squash
          echo "PR #$PR mergeado tras CI verde" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
