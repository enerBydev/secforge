name: _probe-ref

# TEMPORAL: mide cómo se rellenan GITHUB_REF / ref_name al despachar por API
# sobre un TAG (no una rama). Se elimina tras la medición.

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'valor de prueba'
        required: false
        default: 'vacio'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Medir contexto de ref
        run: |
          {
            echo "GITHUB_REF=$GITHUB_REF"
            echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
            echo "ref=${{ github.ref }}"
            echo "ref_name=${{ github.ref_name }}"
            echo "sha=${{ github.sha }}"
            echo "inputs.test=${{ inputs.test }}"
            echo "inputs__context_defined=${{ inputs != '' }}"
          } | tee "$RUNNER_TEMP/probe.txt"
          cat "$RUNNER_TEMP/probe.txt" >> "$GITHUB_STEP_SUMMARY"
