name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Permite re-disparar el CI sobre la rama de un PR creado por GITHUB_TOKEN
  # (los eventos pull_request de ese token no generan runs). Ver digest-update.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: L0 — estático (flake check + linters)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix flake check --all-systems

  build-slim:
    name: L1+L2 — build slim + smoke
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: secforge
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Un fork sin token no debe romper el build; el push a Cachix es best-effort en PRs.
        continue-on-error: true
      - run: nix build .#kali-slim
      - run: docker load < result
      - run: RUNTIME=docker bash tests/smoke.sh secforge-slim:nix tests/smoke/slim.tsv
