name: _dispatch-test

# TEMPORAL: valida que un workflow pueda despachar OTRO workflow por API
# usando GITHUB_TOKEN (documentado: workflow_dispatch/repository_dispatch sí se
# disparan con GITHUB_TOKEN; push/pull_request NO).

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Despachar _probe-ref con GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          gh workflow run _probe-ref.yml --ref probe-v0 -f test=desde-gh-token
          echo "dispatch solicitado"
