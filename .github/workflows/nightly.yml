name: nightly

# Detección proactiva de roturas upstream (Kali rolling y nixpkgs cambian).
# Rojo → issue automático con el log.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC diario
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rebuild-all:
    name: rebuild + smoke ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, network, web, password, recon, forensics, blueteam, redteam, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: secforge
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#kali-${{ matrix.variant }}
      - run: |
          docker load < result
          RUNTIME=docker bash tests/smoke.sh "secforge-${{ matrix.variant }}:nix" "tests/smoke/${{ matrix.variant }}.tsv"

  create-issue-if-red:
    needs: [rebuild-all]
    if: failure() || cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Abrir issue automático con el fallo
        run: |
          gh issue create \
            --title "ROJO nightly $(date -u +%F): rebuild/smoke falló" \
            --body "El build nocturno falló. Revisar el run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Causas probables (ver docs/TROUBLESHOOTING.md):
          - Kali rolling cambió algo que rompe apt/smoke
          - nixpkgs-unstable actualizó un paquete y rompió una tool
          - Rotura de la propia toolchain (nixpkgs issue #240919, hashes de prefetch...)" \
            --label bug || echo "No se pudo crear el issue (¿labels faltantes?)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
